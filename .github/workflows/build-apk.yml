name: build-apk
on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-widget assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-widget/app/build/outputs/apk/debug/app-debug.apk EventsWidget.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EventsWidget.apk --title "EventsWidget (latest)" --notes "週末イベント ウィジェットの最新APK"
